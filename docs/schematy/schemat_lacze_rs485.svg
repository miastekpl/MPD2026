<line x1="1470" y1="365" x2="1560" y2="365" stroke="#111" stroke-width="2"/>
<line x1="440" y1="405" x2="470" y2="405" stroke="#c1121f" stroke-width="3"/>
<line x1="470" y1="405" x2="470" y2="560" stroke="#c1121f" stroke-width="3"/>
<line x1="470" y1="560" x2="1540" y2="560" stroke="#c1121f" stroke-width="3"/>
<line x1="1540" y1="560" x2="1540" y2="405" stroke="#c1121f" stroke-width="3"/>
<line x1="1540" y1="405" x2="1560" y2="405" stroke="#c1121f" stroke-width="3"/>
<text x="1000" y="552" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c1121f" text-anchor="middle" font-weight="bold" >+5 V przez ten sam kabel (żyły +5 V / GND), PTC &gt;= 1 A po stronie sterownika</text>
<line x1="440" y1="370" x2="450" y2="370" stroke="#111" stroke-width="2"/>
<line x1="450" y1="370" x2="450" y2="600" stroke="#111" stroke-width="2"/>
<line x1="450" y1="600" x2="1520" y2="600" stroke="#111" stroke-width="2"/>
<line x1="1520" y1="600" x2="1520" y2="370" stroke="#111" stroke-width="2"/>
<line x1="1520" y1="370" x2="1560" y2="370" stroke="#111" stroke-width="2"/>
<text x="1000" y="620" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="bold" >GND (wspólna masa sygnałowa i zasilania)</text>
<text x="40" y="700" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#0b1f4a" text-anchor="start" font-weight="normal" >Zalety: brak zależności od WiFi (zakłócenia, hasło, limit 4 klientów, czas łączenia), stały niski czas reakcji STOP, zasilanie i dane w jednym kablu.</text>
<text x="40" y="726" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#0b1f4a" text-anchor="start" font-weight="normal" >Wymagania: nowy moduł komunikacyjny w firmware sterownika i modułu 7" (rozdz. wdrożenia w LACZE_PRZEWODOWE.md); WiFi zostaje jako łącze zapasowe i dla telefonów.</text>
<text x="40" y="752" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#b71c1c" text-anchor="start" font-weight="normal" >Fizyczny STOP sterownika (panel, pilot, pedał) nadal jest głównym zabezpieczeniem — łącze przewodowe go nie zastępuje.</text>
</svg>
