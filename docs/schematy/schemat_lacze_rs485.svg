<text x="574" y="375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="normal" >GND</text>
<text x="816" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="end" font-weight="bold" >A</text>
<text x="816" y="335" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="end" font-weight="bold" >B</text>
<circle cx="830" cy="296" r="4" fill="#1b5e20" stroke="none" stroke-width="1"/>
<circle cx="830" cy="331" r="4" fill="#1b5e20" stroke="none" stroke-width="1"/>
<text x="816" y="420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#555" text-anchor="end" font-weight="normal" >terminator 120 ohm A-B</text>
<line x1="440" y1="245" x2="470" y2="245" stroke="#1b5e20" stroke-width="2"/>
<line x1="470" y1="245" x2="470" y2="296" stroke="#1b5e20" stroke-width="2"/>
