<line x1="530" y1="371" x2="560" y2="371" stroke="#111" stroke-width="2"/>
<rect x="860" y="240" width="300" height="150" rx="10" fill="#fff8e1" stroke="#e65100" stroke-width="2.5" />
<text x="1010" y="268" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold" >Kabel ekranowany 2 x 2 x 0,5 mm2</text>
<text x="1010" y="290" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" >skrętka A/B + skrętka +5 V/GND</text>
<text x="1010" y="312" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" >ekran do PE po jednej stronie</text>
<text x="1010" y="334" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" >złącze M12 A, 4 piny, IP67</text>
<text x="1010" y="356" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" >długość zwykle 1-5 m (RS-485 do 1200 m)</text>
<text x="1010" y="378" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="normal" >pin 1 +5 V, 2 A, 3 GND, 4 B</text>
<line x1="830" y1="296" x2="860" y2="296" stroke="#e65100" stroke-width="3"/>
<line x1="830" y1="331" x2="860" y2="331" stroke="#e65100" stroke-width="3"/>
