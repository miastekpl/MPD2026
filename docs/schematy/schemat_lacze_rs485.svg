<text x="1446" y="325" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="end" font-weight="normal" >TXD  -&gt; RX modułu</text>
<circle cx="1460" cy="346" r="4" fill="#1b5e20" stroke="none" stroke-width="1"/>
<text x="1446" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="end" font-weight="normal" >VCC  3V3</text>
<circle cx="1460" cy="371" r="4" fill="#1b5e20" stroke="none" stroke-width="1"/>
<text x="1446" y="375" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="end" font-weight="normal" >GND</text>
<rect x="1560" y="140" width="380" height="520" rx="12" fill="#ede7f6" stroke="#311b92" stroke-width="3" />
<text x="1750" y="172" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#311b92" text-anchor="middle" font-weight="bold" >Moduł 7" Sunton ESP32-8048S070C</text>
<circle cx="1560" cy="245" r="5" fill="#311b92" stroke="none" stroke-width="1"/>
<text x="1580" y="250" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="start" font-weight="bold" >GPIO 17  UART1 TX</text>
<circle cx="1560" cy="285" r="5" fill="#311b92" stroke="none" stroke-width="1"/>
<text x="1580" y="290" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="start" font-weight="bold" >GPIO 18  UART1 RX</text>
<circle cx="1560" cy="325" r="5" fill="#311b92" stroke="none" stroke-width="1"/>
<text x="1580" y="330" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="start" font-weight="bold" >3V3 (złącze rozszerzeń)</text>
<circle cx="1560" cy="365" r="5" fill="#311b92" stroke="none" stroke-width="1"/>
<text x="1580" y="370" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="start" font-weight="bold" >GND</text>
<circle cx="1560" cy="405" r="5" fill="#311b92" stroke="none" stroke-width="1"/>
<text x="1580" y="410" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c1121f" text-anchor="start" font-weight="bold" >+5 V (zasilanie płytki)</text>
<text x="1580" y="470" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >GPIO 17/18 są wolne (I2S wzmacniacza i INT dotyku</text>
<text x="1580" y="488" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >niewykorzystane w projekcie; sprawdzić mostek R17).</text>
<text x="1580" y="522" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="normal" >GPIO 43/44 (UART0) zostają dla USB i programowania.</text>
<line x1="1460" y1="296" x2="1510" y2="296" stroke="#1b5e20" stroke-width="2"/>
<line x1="1510" y1="296" x2="1510" y2="285" stroke="#1b5e20" stroke-width="2"/>
