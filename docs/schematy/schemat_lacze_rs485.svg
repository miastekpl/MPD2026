<text x="574" y="325" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="normal" >TXD  -&gt; RX sterownika</text>
<circle cx="560" cy="346" r="4" fill="#1b5e20" stroke="none" stroke-width="1"/>
<text x="574" y="350" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="normal" >VCC  3V3</text>
