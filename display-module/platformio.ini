; ============================================================
; MPD2026 - Moduł wyświetlacza 7" (Sunton ESP32-8048S070C)
; ESP32-S3, 800x480 RGB, dotyk GT911, PSRAM 8MB OPI, flash 16MB
; Działa jako klient WiFi sterownika Trassar (bez zmian w jego API)
; ============================================================

[platformio]
default_envs = sunton7

; Środowiska:
;   sunton7          - ekran poziomy 800x480 (domyślny)
;   sunton7_portrait - ekran pionowy 480x800 (panel pionowy z klawiszami obok etykiet wzorców)

[env:sunton7]
platform = espressif32@6.3.1
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Os
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -I src
    -Wall
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-unused-but-set-variable

; Wariant pionowy: ten sam kod, interfejs 480x800. Kierunek obrotu ekranu: -DUI_ROTATION=1 lub 3
; (jeśli obraz jest odwrócony o 180 stopni, zmień na 3).
[env:sunton7_portrait]
extends = env:sunton7
build_flags =
    ${env:sunton7.build_flags}
    -DUI_PORTRAIT=1
    -DUI_ROTATION=1
