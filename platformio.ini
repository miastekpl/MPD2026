; ============================================================
; TrassarV3 - Komputer pokładowy malowarki pasów drogowych
; Platforma: ESP32-S3 N16R8
; Wersja: 2.53.0
; ============================================================

[platformio]
default_envs = esp32s3

; ============================================================
; DOCELOWY: sterownik "headless" (bez żadnego ekranu bezpośrednio podłączonego) +
; moduł wyświetlacza Sunton ESP32-8048S070C (display-module/, LVGL) po WiFi.
; CAŁY interfejs (menu, statystyki, ustawienia) to kod C++ w display-module/ -
; ZERO ręcznej pracy w zewnętrznym narzędziu GUI (w odróżnieniu od env:esp32s3_terminal
; poniżej, gdzie ekran DGUS wymaga ręcznie zbudowanego projektu w DGUS Designer).
; Bez ILI9341 (Sunton ma już pełne menu) i bez joysticka (Sunton ma dotyk) -
; patrz docs/MODUL_WYSWIETLACZA.md.
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Pamiec flash i PSRAM ---
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB_littlefs.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

; --- Monitor szeregowy ---
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

; --- Biblioteki ---
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.0.3
    links2004/WebSockets@^2.4.1
    ricmoo/QRCode@^0.0.1

; --- Konfiguracja TFT_eSPI przez flagi kompilacji ---
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTOUCH_CS=15
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DFW_VERSION=\"2.53.0\"
    -DDEBUG_LOG
    -DLOG_LEVEL=LOG_LEVEL_DEBUG
    -DHTTP_MAX_DATA_WAIT=3000
    -DHTTP_MAX_CLOSE_WAIT=1000
    -Ishared
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DHAS_SMALL_TFT=0
    -DHAS_JOYSTICK=0
    -DHAS_DGUS_LINK=0
    -DHAS_ESTOP=1
build_src_filter =
    +<*>
    -<display_*.cpp>
lib_ignore =
    TFT_eSPI
    QRCode

; --- Static analysis ---
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --suppress=missingIncludeSystem

; ============================================================
; ALTERNATYWA (nie zalecana jako punkt startowy — wymaga ręcznej pracy w DGUS Designer,
; osobnym narzędziu GUI producenta, patrz docs/EKRAN_DGUS.md): inteligentny wyświetlacz
; DWIN DGUS (np. DMG10600T070_09WTC) podłączony BEZPOŚREDNIO na UART1 (GPIO 9/10), bez
; pośredniczącego ESP32 (protokół DGUS: shared/dgus_protocol.h, src/dgus/dgus_link.cpp,
; docs/ARCHITEKTURA_TERMINAL.md). Karta SD: osobny moduł (SCK 12, MISO 13, MOSI 11, CS 16).
; ============================================================
[env:esp32s3_terminal]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DHAS_SMALL_TFT=0
    -DHAS_JOYSTICK=1
    -DHAS_DGUS_LINK=1
    -DHAS_ESTOP=1
build_src_filter =
    +<*>
    -<display_*.cpp>
lib_ignore =
    TFT_eSPI
    QRCode

; ============================================================
; Srodowisko native do unit testow (pio test -e native)
; Testuje czysta logike (shouldGunFire, wzorce) bez hardware
; ============================================================
[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -DFW_VERSION=\"2.53.0\"
    -std=c++17
    -Isrc
    -Ishared
; Testy importuja logike z src/gun_logic.h — nie kompilujemy plikow .cpp z src/
test_build_src = no
src_filter = -<*>
